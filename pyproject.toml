[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "music-ai-artwork"
version = "0.3.0"
description = "Deterministic artwork-to-music exploration in a 4 by 4 grid"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "opencv-python-headless>=4.9,<5",
  "scikit-learn>=1.4,<2", "Pillow>=10,<13", "pydantic>=2.7,<3",
  "pretty_midi>=0.2.10,<0.3", "mido>=1.3,<2", "PyYAML>=6,<7",
  "threadpoolctl>=3.2,<4",
]

[project.optional-dependencies]
vision = ["openai>=1.68,<3"]
playback = ["python-rtmidi>=1.5,<2"]
dev = ["pytest>=8,<10"]

[project.scripts]
artwork-music = "artwork_music.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
artwork_music = ["config/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
